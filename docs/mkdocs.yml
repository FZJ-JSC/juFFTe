site_name: juFFTe
site_description: Modern Fast Fourier Transform library in Fortran
site_author: juFFTe Developers
repo_url: https://github.com/FZJ-JSC/juFFTe/
repo_name: gitlab

docs_dir: content
site_dir: ../site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Tutorials:
      - Getting Started: tutorials/getting-started.md
  - API Reference:
      - Overview: api/index.md
  - Examples:
      - Simple 1D FFT: examples/simple-1d-fft.md
  - Contributing: CONTRIBUTING.md
  - Deployment Guide: DEPLOYMENT.md
  - Documentation Tooling: DOCUMENTATION.md
  - Zensical Setup: ZENSICAL_SETUP.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/gitlab
      link: https://github.com/FZJ-JSC/juFFTe/

copyright: Copyright © 2026 juFFTe developers | Licensed under Apache-2.0